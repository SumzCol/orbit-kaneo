# Fork-only. Builds the images this instance runs from; there is no versioned
# release. The reusable build stamps a version only when one is passed, so
# omitting it builds the tree as-is, and it derives the registry from the
# repository owner — so these publish to this fork, never upstream.
name: Deploy

on:
  push:
    branches: [orbit]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build and publish images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      # Scopes the packages to this fork. Without it the images land on the
      # org-wide names `api` and `web`, which any other SumzCol repository
      # would push straight into.
      image_prefix: orbit-
      # build-images publishes only from the ref named here, and verifies the
      # same ref again in verify-release-source.mjs. Upstream's default is main;
      # this fork deploys what is on orbit.
      publish_ref: refs/heads/orbit
      # There is no release version to stamp or verify here. `nightly` is the
      # mode that builds the run SHA as-is and rejects a version outright, which
      # is exactly this build. The default, `released`, would demand a tag.
      source_mode: nightly
      # `orbit` is what deployments track; the SHA tag is what makes a rollback
      # possible, since `orbit` alone has no history to roll back to.
      tags: |
        type=raw,value=orbit
        type=sha,format=long
